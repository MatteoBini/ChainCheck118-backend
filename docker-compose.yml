name: chaincheck118

services:
  postgres:
    image: postgres:16-alpine
    container_name: chaincheck118-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaincheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaincheck}
      POSTGRES_DB: ${POSTGRES_DB:-chaincheck118}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chaincheck} -d ${POSTGRES_DB:-chaincheck118}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chain:
    build:
      context: ./contracts
      dockerfile: Dockerfile.dev
    container_name: chaincheck118-chain
    restart: unless-stopped
    ports:
      - "8545:8545"
    volumes:
      - ./contracts:/app
      - contracts_node_modules:/app/node_modules

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: chaincheck118-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chain:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-non-usare-in-produzione-32+}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_PASSWORD: ${SEED_PASSWORD:-password123}
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaincheck}:${POSTGRES_PASSWORD:-chaincheck}@postgres:5432/${POSTGRES_DB:-chaincheck118}?schema=public
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://chain:8545}
      CHAIN_PRIVATE_KEY: ${CHAIN_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      CHAIN_CONTRACT_ADDRESS: ${CHAIN_CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - node_modules:/app/node_modules

volumes:
  postgres_data:
  node_modules:
  contracts_node_modules:
