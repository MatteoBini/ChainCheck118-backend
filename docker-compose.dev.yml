# Ambiente di SVILUPPO del backend ChainCheck118.
#
#   docker compose -f docker-compose.dev.yml up --build        # API → http://localhost:3000
#   docker compose -f docker-compose.dev.yml --profile tools up  # + Prisma Studio → http://localhost:5555
#
# - src/, prisma/ ecc. sono montati: tsx riavvia l'API a ogni modifica.
# - All'avvio l'API applica le migrazioni e lancia il seed (idempotente).
# - La chain deploya ChainCheckRegistry da sola; l'API parte quando il contratto è pronto.
# - Debugger Node su localhost:9229 (VS Code: "Attach to API (Docker)").
# - Se cambia package-lock.json basta riavviare il servizio: le dipendenze si riallineano da sole.
#
# Variabili (facoltative, da .env): PORT, CHAIN_PORT, LOG_LEVEL, POSTGRES_*, JWT_*, SEED_PASSWORD.

name: chaincheck118-backend-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaincheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaincheck}
      POSTGRES_DB: ${POSTGRES_DB:-chaincheck118}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chain:
    build:
      context: .
      dockerfile: docker/chain/Dockerfile
      target: dev
    restart: unless-stopped
    init: true
    ports:
      - "${CHAIN_PORT:-8545}:8545"
    volumes:
      - ./contracts:/app
      - chain_node_modules:/app/node_modules

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      chain:
        condition: service_healthy
    # --inspect: debugger; --clear-screen=false: log leggibili con `docker compose logs`.
    command: npx tsx watch --clear-screen=false --inspect=0.0.0.0:9229 src/server.ts
    environment: &api-env
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # I bind mount da Windows/macOS non propagano gli eventi del filesystem.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-non-usare-in-produzione-32+}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      SEED_PASSWORD: ${SEED_PASSWORD:-password123}
      # Indirizzi interni alla rete Docker: non presi dal .env (che punta a localhost).
      DATABASE_URL: postgresql://${POSTGRES_USER:-chaincheck}:${POSTGRES_PASSWORD:-chaincheck}@postgres:5432/${POSTGRES_DB:-chaincheck118}?schema=public
      CHAIN_RPC_URL: http://chain:8545
      # Account #0 e indirizzo deterministico del primo deploy del nodo Hardhat.
      CHAIN_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      CHAIN_CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
    ports:
      - "${PORT:-3000}:3000"
      - "127.0.0.1:9229:9229"
    volumes: &api-volumes
      - .:/app
      - api_node_modules:/app/node_modules

  studio:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    depends_on:
      api:
        condition: service_started
    command: npx prisma studio --port 5555 --browser none
    environment:
      <<: *api-env
      SKIP_DB_SETUP: "true"
    ports:
      - "5555:5555"
    volumes: *api-volumes

volumes:
  postgres_data:
  api_node_modules:
  chain_node_modules:
